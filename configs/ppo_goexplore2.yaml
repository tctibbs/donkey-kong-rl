# Go-Explore round 2: DIVERSE deep demos (50 distinct non-sticky trajectories
# 10k-20.1k, replay-validated) merged with self-demos. Tests whether GE1's
# transfer failure was demo monotony (25 near-clones) rather than the
# non-sticky gap. Sticky wave 3b runs in parallel for the next round.
name: ppo_goexplore2_25m
seed: 1
total_timesteps: 25000000
algo: ppo
env:
  num_envs: 64
  num_threads: 12
  reward_transform: scale
  reward_scale: 0.01
bc:
  enabled: true
  demo_path: data/demos_deep20k.npz
  epochs: 10
  aux_coef: 1.0
  aux_anneal_updates: 400
  aux_coef_floor: 0.15
checkpoint_interval_updates: 400
track: true
