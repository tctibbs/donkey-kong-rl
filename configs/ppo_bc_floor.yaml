# E10: kickstarting with a permanent BC pressure floor. E9 showed clears
# collapse when the aux loss anneals to zero (clearing is EV-negative at 25
# percent execution reliability vs reliable farming). The floor keeps the
# climbing behavior alive permanently while PPO improves execution.
name: ppo_bc_floor_10m
seed: 1
total_timesteps: 10000000
algo: ppo
env:
  num_envs: 64
  num_threads: 12
  reward_transform: scale
  reward_scale: 0.01
bc:
  enabled: true
  demo_path: data/demos_screen1_sticky.npz
  epochs: 10
  aux_coef: 1.0
  aux_anneal_updates: 400
  aux_coef_floor: 0.15
checkpoint_interval_updates: 200
track: true
