# Recurrent kickstarting: the same recipe that capped the feedforward policy
# at ~7.1k (robust Go-Explore demos, BC init, aux floor 0.15, scale), now
# with an LSTM so the policy can integrate flame velocity across time. Direct
# test of the campaign conclusion that the 7k ceiling is architectural.
name: ppo_lstm_kickstart_25m
seed: 1
total_timesteps: 25000000
algo: ppo_lstm
env:
  num_envs: 64
  num_threads: 12
  reward_transform: scale
  reward_scale: 0.01
lstm:
  hidden_size: 256
bc:
  enabled: true
  demo_path: data/demos_det_v1.npz
  epochs: 10
  aux_coef: 1.0
  aux_anneal_updates: 400
  aux_coef_floor: 0.15
checkpoint_interval_updates: 400
track: true
