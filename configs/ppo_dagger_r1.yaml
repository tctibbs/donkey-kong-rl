# Search-DAgger round 1 (ADR 0005): kickstart from the aggregated dataset of
# robust Go-Explore demos plus search-relabeled states the GE3 policy actually
# visited. The DAgger labels teach recovery from the policy's own mistakes,
# the missing ingredient that capped pure imitation at ~7k. demo_path is the
# merged dataset (build with dagger merge + replay-demos), regenerable.
name: ppo_dagger_r1_15m
seed: 1
total_timesteps: 15000000
algo: ppo
env:
  num_envs: 64
  num_threads: 12
  reward_transform: scale
  reward_scale: 0.01
bc:
  enabled: true
  demo_path: data/demos_dagger_r1.npz
  epochs: 10
  aux_coef: 1.0
  aux_anneal_updates: 400
  aux_coef_floor: 0.2
checkpoint_interval_updates: 400
track: true
