# Self-Imitation Learning (Oh et al. 2018), the top untried lever from the
# methods survey. Warm-start from the best feedforward agent (GE3, 7,123),
# seed the SIL buffer with deep Go-Explore trajectories (incl. the 30,100),
# and run PPO with self-imitation updates that pull the policy toward
# high-return transitions inside the on-policy loop. This is the Go-Explore
# robustification mechanism: convert high-return experience into a robust
# closed-loop policy without BC covariate shift or restore distribution shift.
name: ppo_sil_15m
seed: 1
total_timesteps: 15000000
algo: ppo_sil
env:
  num_envs: 64
  num_threads: 12
  reward_transform: scale
  reward_scale: 0.01
sil:
  init_from: checkpoints/ppo_goexplore3_25m_s1_20260612_182543/final.pt
  seed_trajectories:
    - data/trajectory_30k.pkl
    - data/explore_d3_w33.pkl
    - data/explore_d3_w32.pkl
  buffer_size: 150000
  updates_per_iter: 4
  vf_coef: 0.01
checkpoint_interval_updates: 400
track: true
