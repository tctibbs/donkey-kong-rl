# GE3: perturbation-robust demos. Explored under deterministic hash-sticky
# 0.25 through the exact training stack, replay-validated with zero
# mismatches. Tests whether robustness (not depth) breaks the 7k transfer
# ceiling documented across the closed-loop experiments.
name: ppo_goexplore3_25m
seed: 1
total_timesteps: 25000000
algo: ppo
env:
  num_envs: 64
  num_threads: 12
  reward_transform: scale
  reward_scale: 0.01
bc:
  enabled: true
  demo_path: data/demos_det_v1.npz
  epochs: 10
  aux_coef: 1.0
  aux_anneal_updates: 400
  aux_coef_floor: 0.15
checkpoint_interval_updates: 400
track: true
